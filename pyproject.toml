[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "observability-agent"
version = "0.1.0"
description = "Agent trajectory evaluation and context engineering for incident diagnosis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "anyio>=4.8,<5",
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/observability_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
